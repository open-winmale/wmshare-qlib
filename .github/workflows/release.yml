name: release

# Every `v*` tag creates a GitHub Release whose body is extracted from the
# matching CHANGELOG section, then publishes sdist/wheel to PyPI.
#
# Design constraints (mirroring the wmshare repo's proven workflow):
#   * a tag that disagrees with `wmshare_qlib.__version__` refuses to publish
#     (guards against a typo'd tag shipping the wrong code);
#   * no third-party actions — gh CLI plus pip-installed build/twine keeps the
#     supply-chain surface minimal;
#   * if the CHANGELOG section cannot be extracted the job fails, so we never
#     publish a Release with no description; the PyPI job depends on it, so a
#     failed version check or missing notes skips the upload too.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import re,pathlib;print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/wmshare_qlib/__init__.py").read_text(encoding="utf-8")).group(1))')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $declared; refusing to release"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          python tools/changelog_section.py "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md
          wc -l /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
