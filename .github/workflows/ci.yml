# CI: Tier-1 tests on every push/PR (zero Qlib, zero credentials, zero EC).
# Tier-2 (pyqlib read-back) runs as a SEPARATE NON-BLOCKING job: the pyqlib
# wheel is notoriously picky to install (needs numpy<2), so a red tier2 job
# reports honestly in Actions history without blocking merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # wmshare 2.1.0 from PyPI (the daily_basic facade's upstream). The
      # adapter's latest-spec adoptions (_fields projection, truncated flag)
      # are signature-gated, so 2.1.0 exercises the fallback paths here; the
      # gated paths are covered by unit-test stubs.
      - name: Install wmshare (PyPI, 2.x floor)
        run: pip install "wmshare>=2.1.0,<3"

      - name: Install package + test deps
        run: pip install -e '.[test]'

      - name: Lint (ruff)
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.4"

      - name: Tier-1 tests (no Qlib, no live/EC)
        run: PYTHONPATH=src python -m pytest tests -q -m "not live"

  tier2:
    # NON-BLOCKING pyqlib read-back (single version - see header comment).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wmshare (PyPI, 2.x floor)
        run: pip install "wmshare>=2.1.0,<3"

      - name: Install package + pyqlib (needs numpy<2)
        run: pip install -e '.[qlib]' "numpy<2"

      - name: Tier-2 Qlib read-back (non-blocking)
        run: PYTHONPATH=src python -m pytest tests -q -m qlib
